<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Self-hosted live view for RTSP cameras with drag-and-drop grid layouts." />
<title>CamViewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="workspace"></main>

  <!-- Small floating control cluster, corner-anchored - collapses out of the way -->
  <div id="controls">
    <button id="controlsToggle" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <div id="controlsPanel" class="hidden">
      <div class="panelTitle">CamViewer</div>
      <button id="addCameraBtn">+ Add camera</button>
      <button id="manageCamerasBtn">Manage cameras</button>
      <div class="presetLabel">Layout</div>
      <div id="presetRow"></div>
    </div>
  </div>

  <!-- Add / edit camera modal -->
  <div id="modalOverlay" class="hidden">
    <div id="modal">
      <h2 id="modalTitle">Add camera</h2>
      <p class="hint">Paste the RTSP URL from UniFi Protect (Camera settings &rarr; Advanced &rarr; RTSP).</p>
      <label>Name
        <input id="camName" type="text" placeholder="Front Door" />
      </label>
      <label>Company
        <input id="camCompany" type="text" placeholder="Optional" />
      </label>
      <label id="camRtspLabel">RTSP URL
        <input id="camRtsp" type="text" placeholder="rtsps://192.168.1.1:7441/abcXYZ123?enableSrtp" />
      </label>
      <p id="modalError" class="error hidden"></p>
      <div class="modalButtons">
        <button id="modalCancel" class="secondary">Cancel</button>
        <button id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Manage cameras overview: list + on/off toggle for every added camera -->
  <div id="manageOverlay" class="hidden">
    <div id="managePanel">
      <h2>Manage cameras</h2>
      <div id="manageList"></div>
      <div class="modalButtons">
        <button id="manageClose" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="emptyState" class="hidden">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 7a2 2 0 0 1 2-2h3l1.5-2h5L16 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.5" />
    </svg>
    <p>No cameras yet</p>
    <p>Open the menu in the corner and click <strong>+ Add camera</strong></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
