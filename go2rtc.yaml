# go2rtc config
#
# Streams are added/removed dynamically by CamViewer's server.js via the API -
# you don't need to list cameras here.
#
# api.listen is localhost-only: the browser never talks to go2rtc directly.
# CamViewer's server.js proxies just the one thing the browser needs (WebRTC
# signaling) under /go2rtc-ws.
#
# api.origin: "*" turns off go2rtc's WebSocket Origin check. That check exists to
# stop random websites from silently opening a stream in the browser's name, but by
# default it only allows an Origin that exactly matches its own listen address - here
# the browser's Origin is CamViewer's address (port 3000, proxied), not go2rtc's own
# 127.0.0.1:1984, so without this it rejects every connection with "request origin not
# allowed by Upgrader.CheckOrigin". Safe here since go2rtc itself isn't reachable from
# the network at all (see api.listen above) - only this app's own proxy can reach it.

api:
  listen: "127.0.0.1:1984"
  origin: "*"

streams:
